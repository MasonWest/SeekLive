<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>时光轴 · 新旧界面对比</title><style>*{box-sizing:border-box}body{background:#eeeee8;margin:0;color:#304034;font-family:"Segoe UI","Microsoft YaHei",sans-serif;padding:30px 34px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}small{font-size:9px;letter-spacing:2px;color:#8a9584}h1{font-weight:500;font-size:24px;letter-spacing:1px;margin:8px 0}header p{font-size:11px;color:#8a9584;margin:0}nav{display:flex;gap:8px}button,a{border:1px solid #d4d9cc;color:#5f7157;font:inherit;font-size:11px;padding:8px 14px;border-radius:6px;background:none;text-decoration:none;cursor:pointer}.active{background:#385a46;color:white;border-color:#385a46}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}.caption{display:flex;align-items:baseline;justify-content:space-between;padding:12px 2px}.caption strong{font-size:13px;font-weight:500}.caption span{font-size:10px;color:#919b89}.panel{padding:9px;background:#faf9f6;border-radius:10px;box-shadow:0 6px 24px #20341e08}.panel img{width:100%;display:block;border-radius:5px}.note{margin-top:23px;padding-top:16px;border-top:1px solid #dce0d4;display:flex;justify-content:space-between;font-size:11px;color:#829077}.mobile .pair{max-width:830px;margin:auto;gap:40px}.mobile .panel{max-width:390px;padding:7px;border-radius:18px}.mobile .panel img{border-radius:13px}.mobile .note{max-width:830px;margin-left:auto;margin-right:auto}@media(max-width:700px){body{padding:20px 14px}header{align-items:flex-start;gap:15px}h1{font-size:19px}nav{flex-wrap:wrap;justify-content:flex-end}button,a{padding:7px 9px}.pair{gap:10px}.caption{display:block}.caption span{display:block;margin-top:5px}.mobile .pair{gap:12px}.note{line-height:1.8;gap:10px;font-size:10px}}</style></head><body><header><div><small>SEEKLIVE / DESIGN STUDY</small><h1>从照片工具，到家庭影像馆。</h1><p>同一组 18 张公开示例照片 · 当前界面实拍与独立新原型</p></div><nav><button id="desktop">桌面</button><button id="mobile">手机</button><a href="index.html">体验新原型 ↗</a></nav></header><div class="pair"><section><div class="caption"><strong>改版前</strong><span>现有布局 · 实际截图</span></div><div class="panel"><img id="before" alt="改版前界面"></div></section><section><div class="caption"><strong>改版后 · 家庭影像馆</strong><span>暖白 × 松绿 · 新原型</span></div><div class="panel"><img id="after" alt="改版后原型"></div></section></div><div class="note"><span>更清晰的导航，更有呼吸感的照片，更安静的管理入口。</span><span>设计预览 · 正式界面尚未替换</span></div><script>function show(m){document.body.classList.toggle('mobile',m==='mobile');document.querySelector('#before').src='previews/before-'+m+'.jpg';document.querySelector('#after').src='previews/after-'+m+'.jpg';document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.id===m))}document.querySelector('#desktop').onclick=()=>show('desktop');document.querySelector('#mobile').onclick=()=>show('mobile');show(new URLSearchParams(location.search).get('mode')==='mobile'?'mobile':'desktop');</script></body></html>
