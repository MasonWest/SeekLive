<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <title>SeekLive · 家庭时光相册</title>
  <defs>
    <linearGradient id="bg" x1="32" y1="0" x2="456" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe3aa"/><stop offset=".48" stop-color="#f7bda9"/><stop offset="1" stop-color="#e991ad"/>
    </linearGradient>
    <linearGradient id="sky" x1="230" y1="104" x2="230" y2="354" gradientUnits="userSpaceOnUse">
      <stop stop-color="#aba1b4"/><stop offset=".48" stop-color="#efbaa6"/><stop offset=".78" stop-color="#ffd0a4"/><stop offset="1" stop-color="#b392aa"/>
    </linearGradient>
    <linearGradient id="paper" x1="142" y1="96" x2="383" y2="426" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffefa"/><stop offset="1" stop-color="#eef0f1"/>
