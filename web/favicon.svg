    <linearGradient id="jacket" x1="334" y1="254" x2="328" y2="361" gradientUnits="userSpaceOnUse">
      <stop stop-color="#464455"/><stop offset="1" stop-color="#292d40"/>
    </linearGradient>
    <radialGradient id="glow"><stop stop-color="#c2eeff" stop-opacity=".9"/><stop offset="1" stop-color="#c2eeff" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-25%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#654c5a" flood-opacity=".28"/>
    </filter>
    <clipPath id="photo"><path d="M151 112H389V354H151z"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
